name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python3 -m compileall -q gamekit.py scripts tests
      - name: Full regression
        run: python3 -m unittest discover -s tests -v
      - name: Clean Git clone install smoke
        run: bash tests/smoke_git_install.sh
