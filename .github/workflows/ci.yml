name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python3 -m compileall -q gamekit.py scripts tests
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Build release archive
        run: python3 scripts/create_release.py
      - name: Inspect ZIP
        run: |
          unzip -t dist/GameAgentKit-v*.zip
          cd dist && sha256sum -c GameAgentKit-v*.zip.sha256
