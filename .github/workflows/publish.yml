name: Publish DRUI GitHub Source Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drui-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source release
        run: |
          set -eu
          test "$(cat VERSION)" = "1.4.3"
          python3 -m compileall -q gamekit.py scripts tests
          python3 -m unittest discover -s tests -v
          bash tests/smoke_git_install.sh
      - name: Publish source-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="v$(cat VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists; never move it"
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$TAG" -m "DRUI $TAG GitHub source"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Source-only release already published; no overwrite"
          else
            gh release create "$TAG" --verify-tag --title "DRUI $TAG — GitHub Source" --notes-file CHANGELOG.md
          fi
